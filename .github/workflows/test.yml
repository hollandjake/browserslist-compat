name: test

on:
  pull_request:
    branches: [main]
  workflow_call: {}

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The lowest version on each supported line (engines, as @babel/compat-data 8 needs: ^22.18.0 || >=24.11.0),
        # and the latest 24
        node: ['22.18', '24.11', '24']
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: 'package.json'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

      - name: Check the package (publint, attw)
        run: bun run check
