name: publish

on:
  workflow_call: {}

permissions:
  contents: read
  # npm trusted publishing: the job proves its identity to npm with a GitHub OIDC token, so no npm token is stored
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: 'package.json'

      # A version already on npm (published by hand, or by an earlier run) isn't published again: npm would refuse it
      - name: Check whether npm has this version
        id: npm
        # Asked of the registry directly, without npm, whose config here holds setup-node's placeholder token
        run: |
          spec="$(node -p 'const p = require("./package.json"); `${encodeURIComponent(p.name)}/${p.version}`')"
          status="$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$spec")"
          if [ "$status" = 200 ]; then
            echo "$spec is on npm already, so it isn't published again"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # Trusted publishing needs npm 11.5.1 or later
      - name: Update npm
        if: steps.npm.outputs.published != 'true'
        run: npm install -g npm@latest

      - name: Install dependencies
        if: steps.npm.outputs.published != 'true'
        run: bun install --frozen-lockfile

      - name: Build
        if: steps.npm.outputs.published != 'true'
        run: bun run build

      - name: Publish
        if: steps.npm.outputs.published != 'true'
        run: npm publish --access public
        env:
          # Empty, so npm authenticates with the OIDC token rather than setup-node's placeholder
          NODE_AUTH_TOKEN: ''
